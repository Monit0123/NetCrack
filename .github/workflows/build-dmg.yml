name: Build DMG

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: Build unsigned DMG (macOS 14)
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Build NetCrack (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project NetCrack.xcodeproj \
            -scheme NetCrack \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee build.log

      - name: Package DMG
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/NetCrack.app"
          test -d "$APP" || { echo "No app product at $APP"; ls -R build/Build/Products || true; exit 1; }

          # Re-sign ad-hoc so the bundle is valid on Apple Silicon even if the
          # build settings above were overridden.
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --verbose=2 "$APP" || true

          rm -rf dist
          mkdir -p dist/stage
          cp -R "$APP" dist/stage/
          ln -s /Applications dist/stage/Applications

          hdiutil create \
            -volname "NetCrack" \
            -srcfolder dist/stage \
            -fs HFS+ \
            -fsargs "-c c=64,a=16,e=16" \
            -format UDZO \
            -imagekey zlib-level=9 \
            -ov "dist/NetCrack.dmg"

          shasum -a 256 dist/NetCrack.dmg | tee dist/NetCrack.dmg.sha256
          ls -lh dist/NetCrack.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetCrack-dmg
          path: |
            dist/NetCrack.dmg
            dist/NetCrack.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # Artifact/log downloads are not reachable from every environment, so the
      # result of the build is also pushed to a dedicated branch. Read it with
      #   git fetch origin ci/build-log && git show origin/ci/build-log:ci-last-build.txt
      - name: Publish build result to ci/build-log
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          set +e
          {
            echo "# NetCrack CI build"
            echo "run:      $GITHUB_RUN_ID"
            echo "ref:      $GITHUB_REF"
            echo "commit:   $GITHUB_SHA"
            echo "result:   $RESULT"
            echo "runner:   $(sw_vers -productVersion) / $(xcodebuild -version | head -1)"
            echo
            echo "## Diagnostics"
            grep -nE "error:|BUILD FAILED|The following build commands failed|fatal error:|xcodebuild:" build.log 2>/dev/null | head -400
            echo
            echo "## Warnings (first 60)"
            grep -nE "warning:" build.log 2>/dev/null | head -60
            echo
            echo "## Tail of the build log"
            tail -120 build.log 2>/dev/null
          } > ci-last-build.txt

          git config user.name "netcrack-ci"
          git config user.email "ci@users.noreply.github.com"
          # An orphan branch: pushing workflow files with the default token is
          # refused, so the log branch must contain nothing but the log.
          git checkout --orphan ci/build-log
          git rm -rf --cached . >/dev/null 2>&1
          rm -rf .github NetCrack NetCrack.xcodeproj Scripts Samples build dist >/dev/null 2>&1
          git add -f ci-last-build.txt
          git commit -m "ci: build $RESULT ($GITHUB_RUN_ID)" --no-verify || true
          git push --force origin ci/build-log 2>&1 | tail -5
